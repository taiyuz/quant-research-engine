[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qre"
version = "0.1.0"
description = "Quantitative trading research engine: strategies, execution costs, and anti-overfitting guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "taiyuz"}]
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
qre-backtest = "qre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qre = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
