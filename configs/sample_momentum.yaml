# Labeled SYNTHETIC demo. GBM drift is 0. Do not tune lookback until Sharpe looks good.
# n_trials: 1 is honest only for a pre-declared spec. If you searched, pass the search size.
# 1+2 bps is a placeholder coupon so costs are not zero, not a market-impact model.
# High daily turnover can flip a modest gross profit to a net loss; see
# tests/test_execution_costs.py::test_high_turnover_costs_flip_modest_gross_profit.
strategy: momentum
lookback: 20
rebalance: daily
fill_delay: 1
costs:
  commission_bps: 1.0
  slippage_bps: 2.0
data:
  n_symbols: 8
  n_bars: 504
  seed: 42
  process: gbm
  delist_mid_sample: true
walk_forward:
  mode: expanding
  train_bars: 252
  test_bars: 63
  step_bars: 63
  embargo_bars: 5
n_trials: 1
purged_cv:
  combinatorial: true
  n_groups: 6
  n_test_groups: 2
  embargo_bars: 5
  label_horizon_bars: 1
